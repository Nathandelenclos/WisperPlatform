# Self-hosted WisperPlatform stack.
#
# Every value comes from `.env` (copied from `.env.example`, never committed): no secret is
# written here.
#
# Scope of the secrets: `web` gets none, `worker` gets its single bearer token — that is the
# whole point of the HMAC media token, a worker holding `MEDIA_TOKEN_SECRET` could forge access
# to any user's media. `migrate` has no `env_file`: a SQL migration needs nothing but a
# connection string, which its `environment` block defines. Only `api` receives the whole file,
# because it alone consumes the three secrets.
#
# Startup: `docker compose build && docker compose up -d`.
# The API image is built once and reused by the `migrate` service.

name: wisper

# Hardening shared by the application services: read-only root, no capability, no privilege
# escalation. Whatever writes goes through a tmpfs or an explicit named volume.
x-hardened: &hardened
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Everything both workers — CPU and GPU — have in common. Only the device, the identifier, the
# model list and the resource bounds tell them apart.
x-worker-env: &worker-env
  WISPER_API_URL: http://wisper-api:3000
  # The shared secret exists under one name only, `WORKER_SHARED_TOKEN`: the worker reads it
  # under its own, but `.env` carries a single value, so no rotation can update only one half of
  # it and leave the worker looping on 401s.
  WISPER_WORKER_TOKEN: ${WORKER_SHARED_TOKEN:?WORKER_SHARED_TOKEN missing from .env}
  WHISPER_BIN: ${WHISPER_BIN:-whisper}
  WHISPER_MODEL_DIR: /home/wisper/.cache/whisper
  POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3}
  TMPDIR: /var/tmp/wisper
  # Diarization: the weights are in the image, at the location `diarization.py` looks for by
  # default — nothing to set for it to work. What stays tunable is the cost and the sensitivity
  # of the clustering: a higher threshold merges two close voices into one, a lower one splits a
  # single voice into several. An unreadable value switches the pass off, it does not kill the
  # worker, and a transcript comes out all the same.
  WISPER_DIARIZATION_THREADS: ${WISPER_DIARIZATION_THREADS:-2}
  WISPER_DIARIZATION_CLUSTER_THRESHOLD: ${WISPER_DIARIZATION_CLUSTER_THRESHOLD:-0.5}

x-worker-base: &worker-base
  <<: *hardened
  # Minimal scope: the worker receives nothing but its bearer token and the API URL. It never
  # mounts the media store — it downloads every media file with a short-lived HTTP token.
  user: "10001:10001"
  depends_on:
    wisper-api:
      condition: service_healthy
  # The worker treats SIGTERM as a clean shutdown: we give it the time to report the failure of
  # the current job rather than letting a lease expire on its own.
  stop_grace_period: 30s
  volumes:
    # The whole `XDG_CACHE_HOME` is mounted, not just `whisper/`: the root is read-only, and a
    # library resolving its cache through XDG would otherwise fail. The weights are thus
    # downloaded once and shared between both workers.
    - whisper-models:/home/wisper/.cache
    # Downloaded media and whisper's temporary outputs: several GiB, hence on disk.
    - worker-scratch:/var/tmp/wisper
  tmpfs:
    - /tmp:size=16m,mode=1777
  pids_limit: 512

services:
  # Prefixed name, not `postgres`: on a host running several stacks, the short name also exists
  # at the neighbours' and Docker's DNS may return theirs — an application connecting to the
  # database next door is a silent incident. The service name IS the DNS name: prefixing it is
  # enough, where an alias can be rewritten by the orchestrator.
  wisper-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    # The only service outside the `x-hardened` anchor, and it is a ceiling we accept. The
    # official entrypoint starts as root to initialise PGDATA inside a fresh root-owned volume,
    # then drops its privileges to the `postgres` user (uid 70): neither a non-root `user:` nor
    # a read-only root survives the first startup. The capabilities are cut down to the five
    # that initialisation requires — `DAC_OVERRIDE` included, without which a root stripped of
    # capabilities cannot write into the volume directory.
    # Once the volume is initialised, `user: "70:70"` + `read_only` + tmpfs on /tmp and
    # /var/run/postgresql are the next step.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing from .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing from .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published port: the database is only reachable from the project network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256

  # Versioned migrations run as a separate, observable step, before any API startup: never at
  # application boot, otherwise N instances migrate concurrently.
  migrate:
    <<: *hardened
    restart: "no"
    image: wisper/api:${IMAGE_TAG:-dev}
    # Image produced by the `api` service: it is neither rebuilt nor pulled from a registry.
    pull_policy: never
    command: ["node", "dist/shared/infrastructure/persistence/migrate.js"]
    environment:
      # Scope cut down to the bare minimum: no `env_file`, hence none of the three application
      # secrets. A SQL migration needs nothing but these two variables.
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@wisper-postgres:5432/${POSTGRES_DB:?}
    user: "1000:1000"
    depends_on:
      wisper-postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

  # Same reason: `api` is the most common name there is, and it is the one the front end
  # resolves to proxy /api. A 502 towards a neighbour's container is the observed symptom.
  wisper-api:
    <<: *hardened
    image: wisper/api:${IMAGE_TAG:-dev}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      additional_contexts:
        workspace: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
    env_file:
      - .env
    environment:
      # Same reversal as for `migrate`: `env_file` would override the image's NODE_ENV.
      NODE_ENV: production
      # Listening port pinned: the port mapping and the healthcheck below both target 3000, a
      # value inherited from `.env` would desynchronise the three.
      PORT: "3000"
      # The API reaches Postgres by service name, not by the `localhost` of the dev `.env`.
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@wisper-postgres:5432/${POSTGRES_DB:?}
      # Multipart uploads land in `<MEDIA_STORE_DIR>/incoming` before adoption: the volume must
      # therefore transiently absorb twice the size of a media file.
      MEDIA_STORE_DIR: /app/media-store
    user: "1000:1000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Published on the loopback only: the front end reaches the API through the project network
    # (nginx proxy, same origin). This publication only serves the Vite development server,
    # whose origin is the only one allowed by the API CORS.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - media-store:/app/media-store
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256

  web:
    <<: *hardened
    image: wisper/web:${IMAGE_TAG:-dev}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      additional_contexts:
        workspace: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
    # No variable: the image contains nothing but static files and nginx, and the front end
    # calls the API on a relative path, same origin.
    user: "101:101"
    # nginx resolves the `api` upstream at runtime: it does not need the API to be healthy to
    # start, only the service to exist in the project.
    depends_on:
      wisper-api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:8080"
    # The only writable spot of the unprivileged image: the pid file and every `*_temp_path` of
    # its base configuration point to /tmp.
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=101,gid=101
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64

  # CPU worker. `WORKER_CPU_REPLICAS=0` switches it off without deleting it: that is what we do
  # on a machine that has a card, so as not to fight the GPU worker over RAM.
  worker:
    <<: *worker-base
    image: wisper/worker:${IMAGE_TAG:-dev}
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        # Image without the CUDA libraries: three times lighter, and enough here.
        TORCH_VARIANT: cpu
    deploy:
      replicas: ${WORKER_CPU_REPLICAS:-1}
    environment:
      <<: *worker-env
      # `auto` probes the card at startup and falls back to CPU when it is missing; the worker
      # announces what it found in its first log line (`device`, `threads`).
      WISPER_DEVICE: ${WISPER_DEVICE:-auto}
      WISPER_WORKER_ID: ${WISPER_WORKER_ID:-compose-worker}
      # `large` asks for ~6 GiB of weights on CPU: widen the list and the memory bound
      # together, never one alone — past the bound, the kernel kills the process without
      # SIGTERM, hence without a failure reported to the API.
      WISPER_WORKER_MODELS: ${WISPER_WORKER_MODELS:-tiny,base,small,medium}
    cpus: ${WORKER_CPUS:-4.0}
    mem_limit: ${WORKER_MEM_LIMIT:-8g}

  # The same worker, on the graphics card. Separate profile, because a device reservation makes
  # `docker compose up` fail on a machine without the NVIDIA driver:
  #     docker compose --profile gpu up -d
  # On GPU whisper runs in fp16: `medium` fits in 4 GiB of VRAM (a GTX 1050 Ti for instance),
  # `large` does not. RAM then carries nothing but the audio decoding and the process.
  worker-gpu:
    <<: *worker-base
    profiles: [gpu]
    # Distinct image: this one bundles the CUDA torch, the other does not.
    image: wisper/worker-gpu:${IMAGE_TAG:-dev}
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        # CUDA 12.4: covers Pascal cards (compute 6.1) and the machine's driver 550.
        # The default PyPI wheel is CUDA 13, which supports neither.
        TORCH_VARIANT: ${TORCH_VARIANT:-cu124}
    environment:
      <<: *worker-env
      WISPER_DEVICE: cuda
      WISPER_WORKER_ID: ${WISPER_GPU_WORKER_ID:-gpu-worker}
      WISPER_WORKER_MODELS: ${WISPER_GPU_WORKER_MODELS:-tiny,base,small,medium}
    cpus: ${WORKER_GPU_CPUS:-2.0}
    mem_limit: ${WORKER_GPU_MEM_LIMIT:-3g}
    gpus: all

volumes:
  postgres-data:
  # Original media, including the `incoming/` directory where multipart uploads land: mounted
  # writable on the API only, never on the worker.
  media-store:
  # Downloaded media and whisper working directory, on the worker side.
  worker-scratch:
  # Worker cache, including the whisper model weights.
  whisper-models:
