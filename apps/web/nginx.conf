# Serveur du SPA WisperPlatform, monté sur /etc/nginx/conf.d/default.conf.
# Le front et l'API sont servis sur la MÊME origine : le cookie de session better-auth reste
# ainsi en SameSite=Lax, sans exigence Secure/None. Le CORS de l'API (WEB_ORIGIN) ne sert donc
# qu'au serveur de développement Vite sur le port 5173.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Aligné sur MEDIA_MAX_BYTES (2 Gio) : sans cela nginx rend 413 dès 1 Mo d'upload.
    client_max_body_size 2g;

    # En-têtes de sécurité des réponses statiques. `add_header` n'est PAS cumulatif : dès qu'une
    # location en déclare un, elle perd tous ceux du niveau supérieur. Ils sont donc répétés
    # dans chaque location qui ajoute son propre en-tête — sinon le document du SPA, servi par
    # redirection interne vers `= /index.html`, repartirait sans `X-Frame-Options`.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # DNS interne de Docker : l'amont est résolu à chaque requête, pas figé au démarrage.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Relai vers l'API, y compris `/api/auth/*` et le flux SSE des segments.
    location /api/ {
        # Amont passé par variable, donc résolu à l'exécution : le conteneur web démarre sans
        # attendre l'API, et une recréation du conteneur `api` (nouvelle IP) ne casse rien.
        # Contrepartie : avec une variable, nginx ne concatène plus l'URI — d'où $request_uri,
        # qui transmet le chemin d'origine (`/api/...`) et la chaîne de requête intacts.
        set $api_upstream "http://api:3000";
        proxy_pass $api_upstream$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (`GET /api/transcriptions/:id/events`) : la connexion reste ouverte et chaque
        # événement doit partir immédiatement, donc aucun tampon et pas de coupure de lecture.
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        # Upload d'un média de plusieurs Gio : nginx ne met pas la requête en tampon disque.
        proxy_request_buffering off;

        # Avec `proxy_request_buffering off`, l'envoi d'un média de 2 Gio s'étale aussi dans la
        # direction du client vers l'amont : le délai d'écriture suit celui de lecture.
        proxy_send_timeout 3600s;
    }

    # Fichiers hachés produits par Vite : immuables, cache long.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Le point d'entrée du SPA n'est jamais mis en cache, sinon un déploiement reste invisible.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Routage côté client : toute route inconnue rend le SPA.
    location / {
        try_files $uri /index.html;
    }
}
