# WisperPlatform SPA server, mounted on /etc/nginx/conf.d/default.conf.
# The front end and the API are served on the SAME origin: the better-auth session cookie thus
# stays on SameSite=Lax, with no Secure/None requirement. The API CORS setting (WEB_ORIGIN)
# therefore serves only the Vite development server on port 5173.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Aligned on MEDIA_MAX_BYTES (2 GiB): without it nginx answers 413 from 1 MB of upload on.
    client_max_body_size 2g;

    # Security headers of the static responses. `add_header` is NOT cumulative: as soon as a
    # location declares one, it loses every header of the level above. They are therefore
    # repeated in each location that adds its own — otherwise the SPA document, served through
    # an internal redirect to `= /index.html`, would leave without `X-Frame-Options`. The
    # `/api/` location declares none, so it inherits these four.
    #
    # The policy is strict because the front end lends itself to it: the document carries
    # neither inline script nor inline style (Vite emits only `<script type="module" src>` and
    # a linked sheet), it calls neither `eval` nor `dangerouslySetInnerHTML`, and every call it
    # makes — REST, SSE, audio, exports — targets the same origin. No `'unsafe-inline'`, no
    # `'unsafe-eval'`: adding them would make the policy decorative. `data:` is open to images
    # only (inline favicon); `object-src 'none'` and `frame-ancestors 'none'` close plugins and
    # framing, and `base-uri 'self'` keeps an injected `<base>` tag from hijacking every
    # relative URL of the page.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker's internal DNS: the upstream is resolved on each request, not frozen at startup.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Relay to the API, `/api/auth/*` and the SSE stream of segments included.
    location /api/ {
        # Upstream passed through a variable, hence resolved at run time: the web container
        # starts without waiting for the API, and recreating the `api` container (new IP)
        # breaks nothing. The trade-off: with a variable, nginx no longer concatenates the URI
        # — hence $request_uri, which passes the original path (`/api/...`) and the query
        # string through untouched.
        # `wisper-api` and not `api`: on a host running several stacks, the short name exists
        # at the neighbours' and Docker's DNS may return theirs. The symptom is a 502
        # “connection refused” towards an address that does not belong to this stack.
        set $api_upstream "http://wisper-api:3000";
        proxy_pass $api_upstream$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (`GET /api/transcriptions/:id/events`): the connection stays open and each event
        # must leave immediately, so no buffering and no read cut-off.
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        # Upload of a media file of several GiB: nginx does not buffer the request to disk.
        proxy_request_buffering off;

        # With `proxy_request_buffering off`, sending a 2 GiB media file also spreads out in
        # the client-to-upstream direction: the write timeout follows the read one.
        proxy_send_timeout 3600s;
    }

    # Hashed files produced by Vite: immutable, long cache.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The entry point of the SPA is never cached, otherwise a deployment stays invisible.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Client-side routing: any unknown route renders the SPA.
    location / {
        try_files $uri /index.html;
    }
}
