# WisperPlatform continuous integration.
#
# Four kinds of work, run in parallel because they need nothing from each other: repository
# guards, code checks, integration tests, and one job per image. Before this split everything
# ran in a single job, so a documentation typo waited behind a torch download; now the wall
# clock is the slowest job, not the sum of all of them.
#
# Every job here is a gate: none is allowed to fail, none carries `continue-on-error`. A check
# that is tolerated when red is not a check.
#
# Each image is built exactly once, in the job that scans it — and, for the worker, publishes
# it. Rebuilding between the scan and the push would mean shipping something nobody scanned.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A stale run of the same ref is cancelled: we do not pay twice for the same intermediate
# commit. Not on the default branch, where two close merges share the ref and cancelling the
# first would leave a shippable commit unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default. The single job that needs to write anything — publishing the
# worker image — asks for `packages: write` for itself and nothing else.
permissions:
  contents: read

jobs:
  # --- Repository guards ---------------------------------------------------------------------
  # The cheapest barriers, and the most urgent: a leaked credential is revoked in seconds, not
  # after an hour of builds. They need the repository and nothing else — no Node, no pnpm.
  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Full history is required by the secret scan. No credentials are left in the checkout
      # and no step here pushes anything.
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `.env` is never committed. CI builds one from the example with non-secret placeholders,
      # only to resolve and validate the compose model. The example carries no secret value, so
      # the two variables the compose file interpolates with `${...:?}` are supplied here and
      # nowhere else.
      - name: Validate the compose model
        run: |
          cp .env.example .env
          printf 'POSTGRES_PASSWORD=ci-placeholder\nWORKER_SHARED_TOKEN=ci-placeholder\n' >> .env
          docker compose config --quiet

      # The whole history, not just the diff: a secret removed in the next commit stays readable
      # in the git objects. `gitleaks git` walks history rather than the working tree, so the
      # `.env` written above does not disturb it. Image pinned by digest, run as the runner's own
      # user, repository mounted read-only, values redacted in the output.
      - name: Scan for secrets (Gitleaks)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1

      # Last in this job, and deliberately: it is a prose gate, not a security one. The sources
      # are English-only — comments, test names, error messages — so a French word slipping back
      # in is caught here rather than in review.
      - name: Check that sources are in English
        run: bash scripts/check-english.sh

  # --- Code checks --------------------------------------------------------------------------
  # Types, the dependency rule, and everything that runs on in-memory doubles. No container,
  # no I/O: this is the job that should answer in a couple of minutes.
  code:
    name: Types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        # The pnpm version comes from the root `packageManager` field.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # Cache key derived from the lockfile, never from the branch: a cache speeds things
          # up, it never fixes anything — a run with a cold cache must pass identically.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency rule (dependency-cruiser)
        run: pnpm lint:arch

      - name: Unit and acceptance tests
        # In-memory doubles only: no I/O, no container.
        run: pnpm --filter @wisper/api exec vitest run --exclude 'test/integration/**'

      - name: Worker tests
        # Standard library only: a few seconds, no I/O, no third-party package installed.
        run: python3 -m unittest discover -s worker/tests -t .

  # --- Integration tests ---------------------------------------------------------------------
  # Separate job because it is the only one that needs a real database, and because it has no
  # reason to wait behind an image build.
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        # A throwaway Postgres started by testcontainers: known initial state, destroyed at the
        # end, never a database shared between runs.
        run: pnpm --filter @wisper/api exec vitest run test/integration

  # --- Application images -------------------------------------------------------------------
  # API and web, in parallel, one job each: build once, prove it starts, scan it. Neither is
  # published — whoever deploys the platform builds them from source.
  #
  # Threshold decided in advance: HIGH and CRITICAL with a fix available fail the pipeline.
  # Vulnerabilities with no available fix are not blocking, otherwise the gate would be red
  # permanently and therefore switched off; those are handled by periodically rebuilding the
  # images on an updated base.
  images:
    name: Image — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      # One failing image must not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - name: api
            service: wisper-api
            image: wisper/api
            # Effective identity, compiled entry point present, and production dependencies
            # resolvable. The shipped `node_modules` is stripped of everything non-production:
            # `better-auth` is named explicitly because it is the package that declares the
            # build tooling behind the esbuild binaries as optional peers, and it has to resolve
            # without them.
            expected_uid: '1000'
            boot: |
              docker run --rm "${IMAGE}" \
                node -e "require('node:fs').accessSync('dist/main.js'); require('@nestjs/core'); require('drizzle-orm'); require('pg'); require('better-auth');"
              docker run --rm "${IMAGE}" \
                node --check dist/shared/infrastructure/persistence/migrate.js
          - name: web
            service: web
            image: wisper/web
            expected_uid: '101'
            # nginx validates its own configuration, proxy and SPA fallback included.
            boot: |
              docker run --rm "${IMAGE}" nginx -t -c /etc/nginx/nginx.conf

    env:
      # Immutable tag derived from the commit: the image that gets scanned is traceable to its
      # source.
      IMAGE_TAG: ${{ github.sha }}
      VCS_REF: ${{ github.sha }}

    steps:
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `docker compose build` resolves the whole model, including the `${...:?}` variables of
      # services it is not building: without them it refuses before reaching the Dockerfile.
      # Non-secret placeholders, used to resolve the model and nothing else.
      - name: Write compose placeholders
        run: |
          cp .env.example .env
          printf 'POSTGRES_PASSWORD=ci-placeholder\nWORKER_SHARED_TOKEN=ci-placeholder\n' >> .env

      - name: Build the image
        run: docker compose build ${{ matrix.service }}

      - name: Prove the image starts
        env:
          IMAGE: ${{ matrix.image }}:${{ github.sha }}
          EXPECTED_UID: ${{ matrix.expected_uid }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "${IMAGE}" -u)" = "${EXPECTED_UID}"
          ${{ matrix.boot }}

      # The image is exported to an archive so Trivy scans it without being handed the Docker
      # socket, which would give it root on the host.
      - name: Export the image
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/images"
          docker save "${{ matrix.image }}:${{ github.sha }}" -o "${RUNNER_TEMP}/images/image.tar"

      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/images/image.tar
          # Outside the working tree: the vulnerability database has no business in the
          # repository, nor in the context of a later build.
          cache-dir: ${{ runner.temp }}/trivy-cache
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          format: table

  # --- Worker image, and its publication ----------------------------------------------------
  # Its own job for two reasons. It carries by far the most expensive work in this pipeline —
  # measured on a real run: 84 s to build (torch plus two ONNX models) and 72 s to push three
  # gigabytes to the registry, against 11 to 45 s for every other job. And it is the only image
  # that gets published, which is a write: the permission stays scoped here rather than being
  # handed to the whole workflow.
  #
  # It also skips itself when nothing that ends up in the image changed. That is where the time
  # actually is: a commit touching only the API, the front or the documentation used to pay 2 min
  # 30 for an image byte-identical to the one already published. `latest` keeps pointing at the
  # last image built from the current worker sources, which is exactly what it should point at.
  worker-image:
    name: Image — worker
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ github.sha }}
      VCS_REF: ${{ github.sha }}

    steps:
      # Full history: the change detection below diffs this commit against a base, which a
      # depth-one checkout cannot see.
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image content depends on the worker sources, its Dockerfile, and the build arguments
      # the compose file passes. Nothing else can change it, so nothing else justifies rebuilding
      # three gigabytes.
      - name: Detect changes to the worker image inputs
        id: inputs
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            *)
              # First push of a branch reports the null sha as `before`: treat it as "everything
              # changed" rather than diffing against a commit that does not exist.
              base="${{ github.event.before }}"
              ;;
          esac
          if [ -z "${base}" ] || [ "${base}" = '0000000000000000000000000000000000000000' ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo 'No usable base commit: building the image.'
            exit 0
          fi
          if git diff --name-only "${base}" "${GITHUB_SHA}" \
            -- worker docker-compose.yml .github/workflows/ci.yml | grep -q .; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo 'Worker image inputs changed: building.'
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo 'No change to the worker image inputs: skipping build, scan and publication.'
          fi

      # Everything below runs only when the image would actually differ. Same reason as the other
      # image jobs for the placeholders: compose resolves the whole model before building.
      - name: Write compose placeholders
        if: steps.inputs.outputs.changed == 'true'
        run: |
          cp .env.example .env
          printf 'POSTGRES_PASSWORD=ci-placeholder\nWORKER_SHARED_TOKEN=ci-placeholder\n' >> .env

      - name: Build the image
        if: steps.inputs.outputs.changed == 'true'
        run: docker compose build worker

      - name: Prove the image starts
        if: steps.inputs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "wisper/worker:${IMAGE_TAG}" -u)" = '10001'
          # A working whisper (torch imported), ffmpeg, and the diarisation stack with its
          # weights where the module looks for them.
          docker run --rm "wisper/worker:${IMAGE_TAG}" whisper --help > /dev/null
          docker run --rm "wisper/worker:${IMAGE_TAG}" ffmpeg -version > /dev/null
          docker run --rm --entrypoint /opt/whisper/bin/python "wisper/worker:${IMAGE_TAG}" \
            -c "import sherpa_onnx, os; [os.stat(p) for p in ('/opt/diarization/segmentation.onnx', '/opt/diarization/embedding.onnx')]"

      - name: Export the image
        if: steps.inputs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/images"
          docker save "wisper/worker:${IMAGE_TAG}" -o "${RUNNER_TEMP}/images/worker.tar"

      - name: Scan the image (Trivy)
        if: steps.inputs.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/images/worker.tar
          cache-dir: ${{ runner.temp }}/trivy-cache
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          format: table

      # The archive is several gigabytes and the runner disk also holds the build stages and the
      # Trivy database: it goes as soon as it has been scanned.
      - name: Drop the archive
        if: steps.inputs.outputs.changed == 'true'
        run: rm -f "${RUNNER_TEMP}/images/worker.tar"

      # This is the image a volunteer runs in one command, without cloning anything or building
      # three gigabytes. Published after the scan, never before, and only from the default
      # branch: a `latest` built from a pull request would carry code nobody merged.
      - name: Publish the image to GHCR
        if: steps.inputs.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          # GHCR refuses an uppercase letter in a reference, and the repository owner has one.
          REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/wisper-worker
        run: |
          set -euo pipefail
          image="$(printf '%s' "${REGISTRY_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          # The run's own token, never an account secret: its scope stops at this repository and
          # it expires with the job. Passed over stdin so it never reaches argv.
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          # Two tags: `latest` for the one-line command, and the commit sha so an incident is
          # traceable to the code that produced it.
          docker tag "wisper/worker:${IMAGE_TAG}" "${image}:latest"
          docker tag "wisper/worker:${IMAGE_TAG}" "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          # The digest is what a deployment should reference: a tag is a human alias, a digest
          # is an identity. Recorded in the run summary so it survives the logs.
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}:latest" 2>/dev/null || true)"
          printf '### Worker image published\n\n- `%s:latest`\n- `%s:%s`\n- digest: `%s`\n' \
            "${image}" "${image}" "${GITHUB_SHA}" "${digest:-unknown}" >> "${GITHUB_STEP_SUMMARY}"
          docker logout ghcr.io
